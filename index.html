<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Timer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏲</text></svg>" />
  </head>
  <body data-state="idle">
    <main>
      <div id="display" class="display" aria-live="off">0:00</div>
      <div id="status" class="status"></div>

      <form id="form" class="entry" autocomplete="off">
        <div id="rows" class="rows"></div>
        <button type="button" id="add" class="add" tabindex="-1" title="Add interval (+)" aria-label="Add interval">+</button>

        <fieldset id="sounds" class="sounds">
          <legend>Sound</legend>
        </fieldset>

        <div class="buttons">
          <button type="submit" tabindex="-1">Start</button>
          <button type="button" id="reset" class="danger" tabindex="-1" title="Reset to a blank timer">Reset</button>
          <button type="button" id="pause" tabindex="-1">Pause</button>
          <button type="button" id="stop" tabindex="-1">Stop</button>
        </div>
      </form>

      <p class="hints">
        <kbd>Tab</kbd> next field · <kbd>+</kbd> add interval ·<kbd>Enter</kbd> start / restart · <kbd>Space</kbd> pause · <kbd>Esc</kbd> stop / reset
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
